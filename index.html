    // ==================== DEMO DATA ====================
    const WORKERS = [
      { id:'w1', name:'Weiming Zhang', passport:'C12345678', password:'demo123', site:'Ramat Gan Tower', phone:'+86 138 0000 1234', avatar:'👷' },
      { id:'w2', name:'Somchai Patel', passport:'T98765432', password:'demo123', site:'Tel Aviv Center', phone:'+66 89 000 5678', avatar:'🧑🏭' },
      { id:'w3', name:'Raj Kumar', passport:'I55667788', password:'demo123', site:'Ramat Gan Tower', phone:'+91 98765 43210', avatar:'👨🔧' },
    ];
    const SITES = ['Ramat Gan Tower', 'Tel Aviv Center'];

    // ==================== STATE ====================
    let lang = localStorage.getItem('sc_lang') || 'en';
    let session = JSON.parse(localStorage.getItem('sc_session') || 'null');
    let tab = 'live'; // admin tabs
    let siteFilter = 'all';
    let showHistory = false;
    let gpsPos = null, gpsErr = null, gpsLoading = false;
    let now = new Date();
    let showLangDropdown = false;

    // Attendance records
    const STORAGE = 'sc_records';
    let records = JSON.parse(localStorage.getItem(STORAGE) || '[]');
    if (!records.length) {
      const today = new Date().toISOString().split('T')[0];
      records = [
        { id:'r1', workerId:'w1', workerName:'Weiming Zhang', site:'Ramat Gan Tower', date:today, checkIn:new Date(Date.now()-6*3600000).toISOString(), checkOut:null, lat:32.0809, lng:34.8067 },
        { id:'r2', workerId:'w3', workerName:'Raj Kumar', site:'Ramat Gan Tower', date:today, checkIn:new Date(Date.now()-5*3600000).toISOString(), checkOut:null, lat:32.0814, lng:34.8070 },
        { id:'r3', workerId:'w2', workerName:'Somchai Patel', site:'Tel Aviv Center', date:today, checkIn:new Date(Date.now()-4*3600000).toISOString(), checkOut:new Date(Date.now()-1.5*3600000).toISOString(), lat:32.0668, lng:34.7753 },
      ];
      // Past records
      for (let d=1;d<=3;d++) {
        const dt = new Date(Date.now()-d*86400000).toISOString().split('T')[0];
        records.push({ id:'rp'+d+'a', workerId:'w1', workerName:'Weiming Zhang', site:'Ramat Gan Tower', date:dt, checkIn:dt+'T06:30:00', checkOut:dt+'T16:00:00', lat:32.0809, lng:34.8067 });
        records.push({ id:'rp'+d+'b', workerId:'w2', workerName:'Somchai Patel', site:'Tel Aviv Center', date:dt, checkIn:dt+'T07:00:00', checkOut:dt+'T17:00:00', lat:32.0668, lng:34.7753 });
        records.push({ id:'rp'+d+'c', workerId:'w3', workerName:'Raj Kumar', site:'Ramat Gan Tower', date:dt, checkIn:dt+'T06:15:00', checkOut:dt+'T14:45:00', lat:32.0809, lng:34.8067 });
      }
      localStorage.setItem(STORAGE, JSON.stringify(records));
    }

    function saveRecords() { localStorage.setItem(STORAGE, JSON.stringify(records)); }

    // ==================== HELPERS ====================
    function t(key) { return (langs[lang] && langs[lang][key]) || langs.en[key] || key; }
    function saveSession() { localStorage.setItem('sc_session', JSON.stringify(session)); }
    function saveLang() { localStorage.setItem('sc_lang', lang); }
    function fmtTime(iso) { if (!iso) return '-'; try { return new Date(iso).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:false}); } catch { return '-'; } }
    function fmtDate(dateStr) { try { return new Date(dateStr+'T00:00:00').toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'}); } catch { return dateStr; } }
    function calcDuration(cin, cout) { if (!cin||!cout) return '-'; const d=new Date(cout)-new Date(cin); const h=Math.floor(d/3600000),m=Math.floor((d%3600000)/60000); return h+'h '+m+'m'; }

    function isCheckedIn(wid) {
      const today = new Date().toISOString().split('T')[0];
      return records.some(r => r.workerId===wid && r.date===today && !r.checkOut);
    }

    function doCheckIn(worker) {
      const today = new Date().toISOString().split('T')[0];
      records = records.filter(r => !(r.workerId===worker.id && r.date===today && !r.checkOut));
      records.push({
        id: 'r'+Date.now(), workerId:worker.id, workerName:worker.name, site:worker.site,
        date: today, checkIn: new Date().toISOString(), checkOut: null,
        lat: gpsPos?.lat??null, lng: gpsPos?.lng??null
      });
      saveRecords(); render();
    }

    function doCheckOut(worker) {
      const now = new Date().toISOString();
      records = records.map(r => {
        if (r.workerId===worker.id && !r.checkOut) return {...r, checkOut:now, lat:gpsPos?.lat??r.lat, lng:gpsPos?.lng??r.lng};
        return r;
      });
      saveRecords(); render();
    }

    // ==================== GPS ====================
    function initGPS() {
      gpsLoading = true; render();
      if (!navigator.geolocation) { gpsErr='nogps'; gpsLoading=false; render(); return; }
      navigator.geolocation.getCurrentPosition(
        pos => { gpsPos={lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:pos.coords.accuracy}; gpsErr=null; gpsLoading=false; render(); },
        err => { gpsLoading=false; if(err.code===1) gpsErr='denied'; else gpsErr='unavail'; render(); },
        {enableHighAccuracy:true, timeout:10000}
      );
      navigator.geolocation.watchPosition(
        pos => {
          gpsPos={lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:pos.coords.accuracy};
          gpsErr=null; gpsLoading=false;
          const ge=document.getElementById('gps-status');
          if(ge) ge.innerHTML=`<div class="text-emerald-700 bg-emerald-50 px-3 py-2 rounded-lg text-sm font-mono">${gpsPos.lat.toFixed(5)}, ${gpsPos.lng.toFixed(5)} <span class="text-xs text-emerald-500 ml-1">±${Math.round(gpsPos.accuracy)}m</span></div>`;
        },
        () => {}, {enableHighAccuracy:true, timeout:10000, maximumAge:5000}
      );
    }

    // ==================== CLOCK ====================
    setInterval(() => { const el=document.getElementById('clock'); if(el) { now=new Date(); el.textContent=now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}); } }, 1000);

    // ==================== RENDER ====================
    function render() {
      const app = document.getElementById('app');
      if (!session || !session.type) { renderLogin(app); }
      else if (session.type === 'worker') { renderWorker(app); }
      else { renderAdmin(app); }
    }

    function renderLogin(el) {
      const w = WORKERS.find(w=>w.id==='preview') || WORKERS[0];
      el.innerHTML = `
        <div class="min-h-screen bg-gradient-to-br from-slate-900 via-cyan-900 to-slate-900 flex flex-col items-center justify-center p-4 fade">
          <div class="absolute top-4 right-4">${langDropdownHTML()}</div>
          <div class="text-center mb-8">
            <div class="text-6xl mb-3">🏗️</div>
            <h1 class="text-3xl font-bold text-white mb-1">${t('appName')}</h1>
            <p class="text-cyan-200 text-sm">${t('sub')}</p>
          </div>
          <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-sm fade">
            <h2 class="text-xl font-semibold text-gray-800 mb-6 text-center">${t('signIn')}</h2>
            <div class="space-y-4">
              <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">${t('passport')}</label>
                <input id="login-passport" type="text" placeholder="e.g. C12345678"
                  class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-cyan-400" autocomplete="off">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">${t('password')}</label>
                <input id="login-password" type="password" placeholder="demo123"
                  class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-cyan-400" autocomplete="off">
              </div>
              <div id="login-error" class="text-red-500 text-sm bg-red-50 px-3 py-2 rounded-lg text-center hidden"></div>
              <button onclick="handleLogin()"
                class="w-full py-2.5 bg-cyan-600 hover:bg-cyan-700 text-white rounded-lg font-medium text-sm transition-colors">
                ${t('signIn')}
              </button>
              <button onclick="handleAdminLogin()"
                class="w-full py-2.5 bg-slate-700 hover:bg-slate-800 text-white rounded-lg font-medium text-sm transition-colors">
                ${t('admin')}
              </button>
            </div>
            <div class="mt-6 p-3 bg-gray-50 rounded-lg">
              <p class="text-xs text-gray-500 text-center"><strong>Demo:</strong> Passport: <code class="bg-gray-100 px-1 rounded">C12345678</code> Password: <code class="bg-gray-100 px-1 rounded">demo123</code></p>
              <p class="text-xs text-gray-500 text-center mt-1"><strong>Admin:</strong> <code class="bg-gray-100 px-1 rounded">admin</code> / <code class="bg-gray-100 px-1 rounded">admin123</code></p>
            </div>
          </div>
        </div>`;
      setTimeout(()=>initGPS(), 500);
    }

    function langDropdownHTML() {
      const curr = langs[lang];
      let html = `<div class="relative inline-block">
        <button onclick="document.getElementById('lang-dd').classList.toggle('hidden')"
          class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white/10 hover:bg-white/20 text-sm text-white">
          <span class="text-lg">${curr.flag}</span><span class="hidden sm:inline text-xs font-medium">${curr.label}</span>
        </button>
        <div id="lang-dd" class="hidden absolute right-0 top-full mt-2 bg-white rounded-xl shadow-xl overflow-hidden z-50 min-w-[160px]">`;
      Object.entries(langs).forEach(([code, l]) => {
        const active = code===lang ? 'bg-cyan-50 text-cyan-700 font-semibold' : 'text-gray-700';
        html += `<button onclick="setLang('${code}')" class="w-full flex items-center gap-2 px-4 py-2.5 text-sm hover:bg-cyan-50 ${active}">
          <span class="text-lg">${l.flag}</span><span>${l.label}</span>${code===lang?'<span class="ml-auto text-cyan-600">✓</span>':''}
        </button>`;
      });
      html += `</div></div>`;
      return html;
    }

    function setLang(code) { lang=code; saveLang(); showLangDropdown=false; render(); }
    window.setLang = setLang;

    function handleLogin() {
      const passport = document.getElementById('login-passport').value.trim();
      const password = document.getElementById('login-password').value;
      const worker = WORKERS.find(w=>w.passport===passport && w.password===password);
      if (worker) { session={type:'worker',workerId:worker.id}; saveSession(); render(); }
      else { const e=document.getElementById('login-error'); e.textContent=t('invalidPass'); e.classList.remove('hidden'); }
    }
    window.handleLogin = handleLogin;

    function handleAdminLogin() {
      const passport = document.getElementById('login-passport').value.trim();
      const password = document.getElementById('login-password').value;
      if (passport==='admin' && password==='admin123') { session={type:'admin'}; saveSession(); render(); }
      else { const e=document.getElementById('login-error'); e.textContent=t('invalidAdmin'); e.classList.remove('hidden'); }
    }
    window.handleAdminLogin = handleAdminLogin;

    function logout() { session=null; localStorage.removeItem('sc_session'); render(); }
    window.logout = logout;

      const worker = WORKERS.find(w=>w.id===session.workerId);
      if (!worker) { logout(); return; }

      const history = records.filter(r=>r.workerId===worker.id).sort((a,b)=>b.date.localeCompare(a.date));

      else if (gpsErr) gpsHTML = `<div class="text-red-500 bg-red-50 px-3 py-2 rounded-lg text-sm">${gpsErr==='denied'?t('gpsDenied'):t('gpsOff')}</div>`;
      else if (gpsPos) gpsHTML = `<div class="text-emerald-700 bg-emerald-50 px-3 py-2 rounded-lg text-sm font-mono">${gpsPos.lat.toFixed(5)}, ${gpsPos.lng.toFixed(5)} <span class="text-xs text-emerald-500 ml-1">±${Math.round(gpsPos.accuracy)}m</span></div>`;

      el.innerHTML = `
        <div class="min-h-screen bg-gray-50 fade">
          <header class="bg-gradient-to-r from-cyan-700 to-cyan-600 text-white px-4 py-4 shadow-md">
            <div class="max-w-2xl mx-auto flex items-center justify-between">
              <div class="flex items-center gap-3">

                  <div class="text-xl font-bold">${t('appName')}</div>

                <button onclick="logout()" class="p-1 rounded-full hover:bg-white/20 text-sm">🚪</button>
              </div>
            </div>
          </header>
          <div class="max-w-2xl mx-auto p-4 space-y-4">
            <div class="bg-white rounded-2xl shadow-lg p-6">
              <div class="text-center mb-4">
                <p class="text-sm text-gray-500">${t('site')}</p>
                <p class="text-lg font-semibold text-gray-800">${worker.site}</p>
              </div>
              <div class="text-center mb-6">
                <p class="text-xs text-gray-400 mb-1">${t('currentTime')}</p>
                <p id="clock" class="text-3xl font-mono font-bold text-gray-800">${now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})}</p>
              </div>
              <button onclick="toggleCheck()"
                class="btn-check w-full py-4 rounded-xl font-bold text-lg transition-all transform active:scale-95 shadow-lg ${checkedIn?'bg-red-500 hover:bg-red-600 text-white':'bg-cyan-600 hover:bg-cyan-700 text-white'}">
                ${checkedIn ? '🚪 '+t('checkOut') : '📍 '+t('checkIn')}
              </button>
              ${checkedIn ? `<div class="mt-3 text-center"><span class="inline-flex items-center gap-1 px-3 py-1 bg-green-100 text-green-700 rounded-full text-sm font-medium">🟢 ${t('checkedIn')}</span></div>` : ''}
            </div>

            <div class="bg-white rounded-2xl shadow p-4">
              <div class="flex items-center gap-2 mb-2">
                📍 <span class="text-sm font-medium text-gray-700">${t('gps')}</span>
              </div>
              ${gpsHTML}
            </div>

            ${latest ? `<div class="bg-white rounded-2xl shadow p-4">
              <h3 class="text-sm font-semibold text-gray-700 mb-2">📋 ${t('lastRecord')}</h3>
              <div class="flex items-center gap-3 text-sm"><span class="text-gray-600">📅 ${fmtDate(latest.date)}</span></div>
              <div class="flex items-center gap-4 mt-2 text-sm">
                <div class="${latest.checkOut?'text-gray-600':'text-green-600'}">🕐 ${fmtTime(latest.checkIn)}</div>
                ${latest.checkOut ? `<div class="text-gray-600">→ ${fmtTime(latest.checkOut)} (${calcDuration(latest.checkIn,latest.checkOut)})</div>` : `<div class="text-green-600 font-medium">🟢 ${t('active')}</div>`}
              </div>
            </div>` : ''}

            <button onclick="toggleHistory()" class="w-full py-3 bg-slate-700 hover:bg-slate-800 text-white rounded-lg font-medium text-sm transition-colors">
              📊 ${t('attendanceHistory')}
            </button>

            ${showHistory ? `<div class="space-y-2">${history.slice(0,10).map(r => `
              <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-100 fade">
                <div class="flex items-center gap-2 text-sm text-gray-500 mb-2">
                  📅 ${fmtDate(r.date)} <span class="text-xs bg-gray-100 px-2 py-0.5 rounded-full">${r.site}</span>
                </div>
                <div class="flex items-center gap-4 text-sm">
                  <div class="${r.checkOut?'text-gray-600':'text-green-600'}">🕐 ${fmtTime(r.checkIn)}</div>
                  ${r.checkOut ? `<div class="text-gray-600">→ ${fmtTime(r.checkOut)} (${calcDuration(r.checkIn,r.checkOut)})</div>` : `<span class="text-green-600 font-semibold text-xs bg-green-100 px-2 py-0.5 rounded-full">🟢 ${t('active')}</span>`}
                </div>
                ${r.lat ? `<div class="mt-2 text-xs text-gray-400">📍 ${r.lat.toFixed(4)}, ${r.lng.toFixed(4)}</div>` : ''}
              </div>`).join('')}</div>` : ''}
          </div>
        </div>`;
      setTimeout(()=>initGPS(), 300);
    }

    function toggleCheck() {
      const worker = WORKERS.find(w=>w.id===session.workerId);
      if (isCheckedIn(worker.id)) doCheckOut(worker); else doCheckIn(worker);
    }
    window.toggleCheck = toggleCheck;

    function toggleHistory() { showHistory=!showHistory; render(); }
    window.toggleHistory = toggleHistory;

    // ==================== ADMIN VIEW ====================
    function renderAdmin(el) {
      const today = new Date().toISOString().split('T')[0];
      const activeRecs = records.filter(r=>r.date===today && !r.checkOut);
      const todayRecs = records.filter(r=>r.date===today);
      const allRecs = [...records].sort((a,b)=>(b.checkIn||'').localeCompare(a.checkIn||''));
      const onSite = siteFilter==='all' ? activeRecs : activeRecs.filter(r=>r.site===siteFilter);
      const todayList = siteFilter==='all' ? todayRecs : todayRecs.filter(r=>r.site===siteFilter);
      const activeSiteCount = new Set(onSite.map(r=>r.site)).size;

      const filtersHTML = SITES.map(s => `<option value="${s}" ${siteFilter===s?'selected':''}>${s}</option>`).join('');

      el.innerHTML = `
        <div class="min-h-screen bg-gray-50 fade">
          <header class="bg-gradient-to-r from-slate-800 to-slate-700 text-white px-4 py-4 shadow-md">
            <div class="max-w-5xl mx-auto flex items-center justify-between">
              <div class="flex items-center gap-3">
                <button onclick="${tab==='live'?'': 'tab=\"live\";render()'}" class="p-1 text-sm">←</button>
                <div>
                  <div class="text-lg font-bold">🏗️ ${t('dashboard')}</div>
                  <div class="text-xs text-slate-300">SiteCheck Admin</div>
                </div>
              </div>
              <div class="flex items-center gap-2">
                <button onclick="langDropdownToggle()" class="p-1 rounded-full hover:bg-white/20">${langs[lang].flag}</button>
                <button onclick="logout()" class="p-1 rounded-full hover:bg-white/20 text-sm">🚪</button>
              </div>
            </div>
            <div id="admin-lang-dd" class="hidden absolute right-4 top-16 bg-white rounded-xl shadow-xl overflow-hidden z-50 min-w-[160px]">
              ${Object.entries(langs).map(([code, l]) => `<button onclick="setLang('${code}')" class="w-full flex items-center gap-2 px-4 py-2.5 text-sm hover:bg-cyan-50 text-gray-700 ${code===lang?'bg-cyan-50 text-cyan-700 font-semibold':''}">
                <span class="text-lg">${l.flag}</span><span>${l.label}</span>
              </button>`).join('')}
            </div>
          </header>

          <div class="max-w-5xl mx-auto p-4 space-y-4">
            <!-- Stats -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
              <div class="bg-white rounded-xl shadow-sm p-4 text-center">
                <div class="text-2xl">👥</div>
                <div class="text-2xl font-bold text-gray-800">${WORKERS.length}</div>
                <div class="text-xs text-gray-500">${t('totalWorkers')}</div>
              </div>
              <div class="bg-white rounded-xl shadow-sm p-4 text-center">
                <div class="text-2xl">📍</div>
                <div class="text-2xl font-bold text-green-600">${onSite.length}</div>
                <div class="text-xs text-gray-500">${t('onSite')}</div>
              </div>
              <div class="bg-white rounded-xl shadow-sm p-4 text-center">
                <div class="text-2xl">🏗️</div>
                <div class="text-2xl font-bold text-amber-600">${activeSiteCount}</div>
                <div class="text-xs text-gray-500">${t('activeSites')}</div>
              </div>
              <div class="bg-white rounded-xl shadow-sm p-4 text-center">
                <div class="text-2xl">📋</div>
                <div class="text-2xl font-bold text-purple-600">${todayList.length}</div>
                <div class="text-xs text-gray-500">${t('todayRec')}</div>
              </div>
            </div>

            <!-- Tabs & Filter -->
            <div class="flex items-center justify-between gap-3 bg-white rounded-xl shadow p-3">
              <div class="flex gap-2">
                <button onclick="tab='live';render()"
                  class="px-4 py-2 rounded-lg text-sm font-medium transition-colors ${tab==='live'?'bg-green-600 text-white':'bg-gray-100 text-gray-600'}">
                  <span class="flex items-center gap-1.5">${tab==='live'?'<span class="w-2 h-2 rounded-full bg-white pulse"></span>':''}${t('liveWorkers')}</span>
                </button>
                <button onclick="tab='all';render()"
                  class="px-4 py-2 rounded-lg text-sm font-medium transition-colors ${tab==='all'?'bg-cyan-600 text-white':'bg-gray-100 text-gray-600'}">
                  ${t('allAttendance')}
                </button>
              </div>
              <select onchange="siteFilter=this.value;render()"
                class="text-sm border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-cyan-400">
                <option value="all">${t('allSites')}</option>
                ${filtersHTML}
              </select>
            </div>

            <!-- Live Workers -->
            ${tab==='live' ? (onSite.length === 0
              ? `<div class="bg-white rounded-xl shadow-sm p-8 text-center text-gray-400">👥<p class="mt-2">${t('noData')}</p></div>`
              : `<div class="grid gap-3 sm:grid-cols-2">
                  ${onSite.map(r => {
                    const w = WORKERS.find(x=>x.id===r.workerId);
                    return `<div class="bg-white rounded-xl shadow-sm p-4 border-l-4 border-green-500 fade">
                      <div class="flex items-center gap-3 mb-2">
                        <span class="text-2xl">${w?.avatar||'👷'}</span>
                        <div><div class="font-semibold text-gray-800">${r.workerName}</div><div class="text-xs text-gray-500">${w?.passport||'-'}</div></div>
                        <span class="ml-auto text-xs bg-green-100 text-green-700 px-2 py-1 rounded-full font-medium">🟢 ${t('checkedIn')}</span>
                      </div>
                      <div class="flex items-center gap-4 text-sm text-gray-600">
                        <span>🏗️ ${r.site}</span>
                        <span>🕐 ${fmtTime(r.checkIn)}</span>
                      </div>
                      ${r.lat ? `<div class="mt-2 text-xs text-gray-400">📍 ${r.lat.toFixed(4)}, ${r.lng.toFixed(4)}</div>` : ''}
                    </div>`;
                  }).join('')}
                </div>`
            ) : ''}

            <!-- All Attendance -->
            ${tab==='all' ? `<div class="bg-white rounded-xl shadow overflow-hidden">
              <div class="hidden md:block overflow-x-auto">
                <table class="w-full text-sm">
                  <thead><tr class="bg-gray-50 text-gray-600">
                    <th class="text-left px-4 py-3 font-medium">${t('worker')}</th>
                    <th class="text-left px-4 py-3 font-medium">${t('site')}</th>
                    <th class="text-left px-4 py-3 font-medium">${t('inTime')}</th>
                    <th class="text-left px-4 py-3 font-medium">${t('outTime')}</th>
                    <th class="text-left px-4 py-3 font-medium">${t('duration')}</th>
                    <th class="text-left px-4 py-3 font-medium">${t('status')}</th>
                  </tr></thead>
                  <tbody>
                    ${todayList.map(r => {
                      const w = WORKERS.find(x=>x.id===r.workerId);
                      return `<tr class="border-t border-gray-100 hover:bg-gray-50">
                        <td class="px-4 py-3"><span class="flex items-center gap-2"><span>${w?.avatar||'👷'}</span><span class="font-medium">${r.workerName}</span></span></td>
                        <td class="px-4 py-3 text-gray-600">${r.site}</td>
                        <td class="px-4 py-3 font-mono">${fmtTime(r.checkIn)}</td>
                        <td class="px-4 py-3 font-mono">${fmtTime(r.checkOut)}</td>
                        <td class="px-4 py-3">${r.checkIn&&r.checkOut?calcDuration(r.checkIn,r.checkOut):'-'}</td>
                        <td class="px-4 py-3">${r.checkOut?'🔴 '+t('checkedOut'):'🟢 '+t('checkedIn')}</td>
                      </tr>`;
                    }).join('')}
                  </tbody>
                </table>
              </div>
              <div class="md:hidden p-3 space-y-2">
                ${todayList.map(r => {
                  const w = WORKERS.find(x=>x.id===r.workerId);
                  return `<div class="bg-gray-50 rounded-lg p-3 fade">
                    <div class="flex items-center gap-2 mb-1">
                      <span>${w?.avatar||'👷'}</span>
                      <span class="font-semibold text-gray-800">${r.workerName}</span>
                      <span class="ml-auto text-xs bg-gray-100 px-2 py-0.5 rounded">${r.site}</span>
                    </div>
                    <div class="grid grid-cols-2 gap-2 text-sm text-gray-600">
                      <div>🕐 ${fmtTime(r.checkIn)}</div>
                      <div>🚪 ${fmtTime(r.checkOut)}</div>
                    </div>
                  </div>`;
                }).join('')}
              </div>
            </div>` : ''}
          </div>
        </div>`;
    }

    function langDropdownToggle() {
      document.getElementById('admin-lang-dd')?.classList.toggle('hidden');
    }
    window.langDropdownToggle = langDropdownToggle;

    // ==================== INIT ====================
    render();
  </script>
</body>
</html>
